name: 🐛 Bug report
description: Report a problem with the trigger framework
title: "[BUG]: "
labels: ["bug"]
assignees: ["dschach"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please search the open and closed issues first, in case it is already known.

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: Describe what happened, and what you expected to happen instead.
    validations:
      required: true

  - type: input
    id: framework-version
    attributes:
      label: Framework version
      description: The release you installed, from the changelog or the releases page.
      placeholder: "2.0.1" # x-release-please-version
    validations:
      required: true

  - type: input
    id: salesforce-release
    attributes:
      label: Salesforce release or API version
      description: The release of your org, or the API version of your trigger and handler.
      placeholder: "Winter '27 or API 67.0"
    validations:
      required: true

  - type: dropdown
    id: org-type
    attributes:
      label: Org type
      options:
        - Production
        - Sandbox
        - Scratch org
        - Developer Edition
        - Trailhead Playground
        - Other (please say which below)
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Trigger and handler code
      description: Your trigger, and the parts of your handler that show the problem. This is shown as Apex.
      render: apex
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Deploy the trigger and handler above.
        2. Update an Account so that ...
        3. See the error.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error message or debug log
      description: Paste the exact error and the relevant debug log lines. Call TriggerHandler.showDebug() before the DML to log when each handler starts and ends.
      render: text

  - type: checkboxes
    id: code-of-conduct
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow the [Code of Conduct](https://github.com/dschach/salesforce-trigger-framework/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true

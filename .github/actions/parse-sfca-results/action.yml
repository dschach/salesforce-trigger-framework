name: "SFCA results priorities"
description: "Count the violations in a Salesforce Code Analyzer JSON report by severity, 1 to 5. CI in this repository does not use it."
author: "David Schach"

inputs:
  results-file:
    description: "Path to the JSON report that the Code Analyzer wrote"
    required: false
    default: "sfca_results.json"

outputs:
  priority1:
    description: "Number of severity 1 violations"
    value: ${{ steps.count.outputs.priority1 }}
  priority2:
    description: "Number of severity 2 violations"
    value: ${{ steps.count.outputs.priority2 }}
  priority3:
    description: "Number of severity 3 violations"
    value: ${{ steps.count.outputs.priority3 }}
  priority4:
    description: "Number of severity 4 violations"
    value: ${{ steps.count.outputs.priority4 }}
  priority5:
    description: "Number of severity 5 violations"
    value: ${{ steps.count.outputs.priority5 }}
  total:
    description: "Number of violations in the report"
    value: ${{ steps.count.outputs.total }}
  violations-table:
    description: "Markdown table of the violations, by file and then by line"
    value: ${{ steps.table.outputs.violations-table }}

runs:
  using: "composite"
  steps:
    - name: "Count violations by severity"
      id: count
      shell: bash
      run: bash "${{ github.action_path }}/count.sh" "${{ inputs.results-file }}"

    - name: "Build the violations table"
      id: table
      shell: bash
      run: bash "${{ github.action_path }}/table.sh" "${{ inputs.results-file }}"

# Runs Release Please. It opens or updates the release pull request from the commit
# messages, and it creates the release when that pull request merges.
# The release-please job in ci.yml calls this workflow after a push to main, but only
# when format-lint and sfca-analysis pass, so a failing push gets no release PR update
# until a fix lands. The Run workflow button starts it by hand.
name: release-please
on:
  workflow_call:
    secrets:
      RELEASE_PLEASE_TOKEN:
        required: true
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    # 1 run at a time, so that 2 quick merges do not update the release PR at once. A
    # run in progress is never cancelled, so a release is never cut off halfway.
    concurrency:
      group: release-please
      cancel-in-progress: false
    steps:
      # A release PR opened with the default GITHUB_TOKEN belongs to github-actions[bot],
      # and GitHub holds its workflow runs until someone approves them. With this
      # fine-grained token the release PR belongs to the token's owner, so its required
      # checks run without approval. The token needs Contents, Pull requests, and Issues
      # (read and write) on this repository, and it expires: renew it before then.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

# Deploys the framework and the sample to a scratch org and runs every Apex test.
# Runs only when the framework, the sample, or this workflow changes, because each
# run costs a scratch org. It is not a required check for that reason. A change to
# sfdx-project.json or the scratch org definition, such as a release version, does
# not start it; run the workflow by hand when such a change needs a test.
# A push to main that changes an Apex class runs it too, so that Codecov has the
# coverage of main to compare each pull request with.
name: Apex tests

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "force-app/**"
      - "sample-handler/**"
      - ".github/workflows/apex-tests.yml"
  push:
    branches:
      - main
    paths:
      - "force-app/**/*.cls"
      - "sample-handler/**/*.cls"

permissions:
  contents: read

# A newer push to the same pull request cancels the run in progress. A push to main
# gets a group of its own, keyed on the commit, so that a quick second merge does not
# cancel the run of the first: GitHub keeps only 1 pending run in a group.
concurrency:
  group: apex-tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  scratch-org-test:
    runs-on: ubuntu-latest
    # The Dev Hub secret is not available to Dependabot or to a pull request from a fork
    if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Set up Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: "Install Salesforce CLI"
        run: |
          npm install --global @salesforce/cli
          sf --version

      # The secret stays in an environment variable and reaches the CLI through
      # standard input, so it never appears in a script or a file.
      - name: "Authenticate Dev Hub"
        env:
          SFDX_AUTH_URL: ${{ secrets.SALESFORCE_AUTH_URL }}
        run: |
          if [ -z "$SFDX_AUTH_URL" ]; then
            echo "Missing SALESFORCE_AUTH_URL secret. Is this workflow running on a fork?"
            exit 1
          fi
          echo "$SFDX_AUTH_URL" | sf org login sfdx-url --alias devhub --set-default-dev-hub --sfdx-url-stdin

      - name: "Create scratch org"
        id: scratch-org
        run: sf org create scratch --definition-file config/project-scratch-def.json --alias ScratchOrg --set-default --duration-days 1 --wait 20 --no-track-source

      - name: "Deploy source to scratch org"
        run: sf project deploy start --source-dir force-app --source-dir sample-handler

      - name: "Run Apex tests"
        run: sf apex run test --test-level RunLocalTests --code-coverage --result-format junit --output-dir ./tests/apex --wait 20

      - name: "Upload code coverage for Apex to Codecov.io"
        uses: codecov/codecov-action@v7
        with:
          flags: Apex
          #token: ${{ secrets.CODECOV_TOKEN }}\
          report_type: coverage
          base_sha: ${{ github.event.pull_request.base.sha }} # Forces base to PR target branch head
          directory: ./tests/apex
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          report_type: test_results
          base_sha: ${{ github.event.pull_request.base.sha }} # Forces base to PR target branch head
          directory: ./tests/apex

      # Runs whenever the create step started, including when a newer push cancelled
      # this run, so that a created org does not wait a day to expire. A failed login
      # skips the create step, so its error stays the last one in the log.
      - name: "Delete scratch org"
        if: ${{ always() && steps.scratch-org.outcome != 'skipped' }}
        run: sf org delete scratch --no-prompt --target-org ScratchOrg || echo "No scratch org to delete."

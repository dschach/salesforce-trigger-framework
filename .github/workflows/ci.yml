# Formatting and static analysis. Runs on every pull request and every push to
# main, for every author, so that a required check always has a real result.
name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

# The token is read-only. A job that needs more states it below.
permissions:
  contents: read

# A newer push to the same pull request or branch cancels the run in progress
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format-lint:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v7

      - name: "Set up Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: "Install npm dependencies"
        run: npm ci

      - name: "Code formatting verification with Prettier"
        run: npm run prettier:verify

  sfca-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v7
      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      # SFCA needs a Java runtime
      - name: "Set up Java"
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli@latest

      - name: Install Latest Salesforce Code Analyzer CLI Plugin
        run: sf plugins install code-analyzer@latest

      - name: "Create the results folder"
        run: mkdir -p sfca

      - name: Run Salesforce Code Analyzer
        id: run-code-analyzer
        run: | # shell
          sf code-analyzer run --workspace . --view detail --output-file sfca/sfca_results.html --output-file sfca/sfca_results.json --output-file sfca/sfca-report.sarif --rule-selector "(pmd,cpd,sfge,regex):(Recommended,Custom)"

      # The action writes the counts and the tables to the job summary, and it never
      # fails the job. The fail step below reads the counts and fails the job.
      - name: "Report SFCA violations"
        if: always()
        id: sfca-report
        uses: ./.github/actions/sf-code-analyzer-report
        with:
          results-path: "sfca/sfca_results.json"
          severity-cutoff: "2"

      - name: "Upload SFCA report"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sfca-report
          path: sfca
          if-no-files-found: warn

      - name: "Fail on priority 1 and 2 SFCA violations"
        if: ${{ steps.sfca-report.outputs.sev1-count != 0 || steps.sfca-report.outputs.sev2-count != 0 }}
        run: |
          echo "SFCA found ${{ steps.sfca-report.outputs.sev1-count }} priority 1 and ${{ steps.sfca-report.outputs.sev2-count }} priority 2 violation(s). See the job summary and the SFCA Report artifact."
          exit 1

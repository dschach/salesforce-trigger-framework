# Formatting and static analysis. Runs on every pull request and every push to
# main, for every author, so that a required check always has a real result.
name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

# The token is read-only. A job that needs more states it below.
permissions:
  contents: read

# A newer push to the same pull request or branch cancels the run in progress
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format-lint:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v7

      - name: "Set up Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: "Install npm dependencies"
        run: npm ci

      - name: "Code formatting verification with Prettier"
        run: npm run prettier:verify

  pmd-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The PMD action lists the changed files of a pull request
      pull-requests: read
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v7

      # PMD needs a Java runtime
      - name: "Set up Java"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Run the latest PMD release with the project ruleset. A pull request
      # analyzes only the changed files; a push analyzes the whole project.
      - name: "Run PMD scan"
        id: pmd
        uses: pmd/pmd-github-action@v2
        with:
          version: "latest"
          sourcePath: "."
          rulesets: "config/pmd/ruleset.xml"
          analyzeModifiedFilesOnly: ${{ github.event_name == 'pull_request' }}

      # The action annotates every violation but never fails the job, and its only
      # output is the total count. Count the violations by the priority the ruleset
      # gives each rule, then fail on priority 1 and 2 only.
      - name: "Count PMD violations by priority"
        id: priorities
        uses: ./.github/actions/pmd-sarif-priorities
        with:
          sarif-file: pmd-report.sarif

      - name: "Report PMD violations by priority"
        run: |
          {
            echo "### PMD"
            echo ""
            echo "| Priority 1 | Priority 2 | Priority 3 | Priority 4 | Priority 5 | Total |"
            echo "| ---------- | ---------- | ---------- | ---------- | ---------- | ----- |"
            echo "| ${{ steps.priorities.outputs.priority1 }} | ${{ steps.priorities.outputs.priority2 }} | ${{ steps.priorities.outputs.priority3 }} | ${{ steps.priorities.outputs.priority4 }} | ${{ steps.priorities.outputs.priority5 }} | ${{ steps.priorities.outputs.total }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Fail on priority 1 and 2 PMD violations"
        if: ${{ steps.priorities.outputs.priority1 != 0 || steps.priorities.outputs.priority2 != 0 }}
        run: |
          echo "PMD found ${{ steps.priorities.outputs.priority1 }} priority 1 and ${{ steps.priorities.outputs.priority2 }} priority 2 violation(s). See the annotations and the PMD Report artifact."
          exit 1

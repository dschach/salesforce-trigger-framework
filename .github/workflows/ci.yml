# Formatting and static analysis. Runs on every pull request and every push to
# main, for every author, so that a required check always has a real result.
name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

# The token is read-only. A job that needs more states it below.
permissions:
  contents: read

# A newer push to the same pull request or branch cancels the run in progress
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format-lint:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v7

      - name: "Set up Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: "Install npm dependencies"
        run: npm ci

      - name: "Code formatting verification with Prettier"
        run: npm run prettier:verify

  sfca-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The SFCA action lists the changed files of a pull request
      pull-requests: read
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v7
      - name: Ensure node v20.9.0 or greater
        uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
      # SFCA needs a Java runtime
      - name: "Set up Java"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Ensure python v3.10 or greater
        uses: actions/setup-python@v6
        with:
          python-version: ">=3.10"

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli@latest

      - name: Install Latest Salesforce Code Analyzer CLI Plugin
        run: sf plugins install code-analyzer@latest

      - name: Run Salesforce Code Analyzer
        id: run-code-analyzer
        uses: forcedotcom/run-code-analyzer@v2
        with:
          run-arguments: --workspace . --view detail --output-file sfca_results.html --output-file sfca_results.json --output-file sfca-report.sarif --rule-selector "(pmd,cpd,sfge,regex):(Recommended,Custom)"
          results-artifact-name: salesforce-code-analyzer-results
          github-token: ${{ github.token }}

      # The action annotates every violation but never fails the job. It writes the
      # counts and the tables to the job summary, and the fail step below reads the counts.
      - name: "Report SFCA violations"
        id: sfca-report
        uses: ./.github/actions/sf-code-analyzer-report
        with:
          results-path: "sfca_results.json"
          severity-cutoff: "2"

      - name: "Upload SFCA report"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sfca-report
          path: |
            salesforce-code-analyzer-results.zip
          if-no-files-found: warn

      - name: "Fail on priority 1 and 2 SFCA violations"
        if: ${{ steps.sfca-report.outputs.sev1-count != 0 || steps.sfca-report.outputs.sev2-count != 0 }}
        run: |
          echo "SFCA found ${{ steps.sfca-report.outputs.sev1-count }} priority 1 and ${{ steps.sfca-report.outputs.sev2-count }} priority 2 violation(s). See the annotations and the SFCA Report artifact."
          exit 1

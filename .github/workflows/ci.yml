# Formatting and static analysis. Runs on every pull request and every push to
# main, for every author, so that a required check always has a real result. After a
# push to main, the release-please job calls the Release Please workflow when both checks
# pass, and the deploy-site job deploys the site when that run creates a release.
name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

# The token is read-only. A job that needs more states it below.
permissions:
  contents: read

# A newer push to the same pull request cancels the run in progress. A push to main
# gets a group of its own, keyed on the commit, so that every commit on main keeps a
# finished check: GitHub keeps only 1 pending run in a group and cancels the rest.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  format-lint:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v7

      - name: "Set up Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: "Install npm dependencies"
        run: npm ci

      - name: "Code formatting verification with Prettier"
        run: npm run prettier:verify

      - name: "Check the sample code in the sample README"
        run: node scripts/sync-sample-code.mjs --check

  # The release pull request of Release Please changes only version numbers, the
  # changelog, and the package ids, never Apex, so the job is skipped there. A skipped job
  # counts as passed for a required check. After the release merges, the push to main runs
  # the job, because the release-please job needs it.
  sfca-analysis:
    if: ${{ !startsWith(github.head_ref, 'release-please--branches--') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v7
      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      # SFCA needs a Java runtime
      - name: "Set up Java"
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli@latest

      - name: Install Latest Salesforce Code Analyzer CLI Plugin
        run: sf plugins install code-analyzer@latest

      - name: "Create the results folder"
        run: mkdir -p sfca

      - name: Run Salesforce Code Analyzer
        id: run-code-analyzer
        run: | # shell
          sf code-analyzer run --workspace . --view detail --output-file sfca/sfca_results.html --output-file sfca/sfca_results.json --output-file sfca/sfca-report.sarif --rule-selector "(pmd,cpd,sfge,regex):(Recommended,Custom)"

      # The action writes the counts and the tables to the job summary. A violation
      # never fails the action: the fail step below reads the counts and fails the job.
      # The action fails only when the results file is missing.
      - name: "Report SFCA violations"
        if: always()
        id: sfca-report
        uses: ./.github/actions/sf-code-analyzer-report
        with:
          results-path: "sfca/sfca_results.json"
          severity-cutoff: "2"

      - name: "Upload SFCA report"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sfca-report
          path: sfca
          if-no-files-found: warn

      - name: "Fail on severity 1 and 2 SFCA violations"
        if: ${{ steps.sfca-report.outputs.sev1-count != 0 || steps.sfca-report.outputs.sev2-count != 0 }}
        run: |
          echo "SFCA found ${{ steps.sfca-report.outputs.sev1-count }} severity 1 and ${{ steps.sfca-report.outputs.sev2-count }} severity 2 violation(s). See the job summary and the SFCA Report artifact."
          exit 1

  # Runs only on the release pull request. It fails while the package ids do not belong
  # to the code that the merge would release, for example before the Release workflow
  # ran, or when another merge changed force-app after the beta. So it also blocks a
  # merge of the release pull request by hand. The Release workflow writes the ids. On
  # every other pull request, the job is skipped, and a skipped job counts as passed for
  # a required check.
  package-ids:
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--branches--main') }}
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v7

      - name: "Set up Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: "Install npm dependencies"
        run: npm ci

      - name: "Check that the package ids belong to the code"
        run: node scripts/package-version.mjs check

  # Release Please runs last, and only for a push to main where both checks passed. A
  # failing push gets no release PR update until a fix lands on main.
  release-please:
    needs: [format-lint, sfca-analysis]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/release-please.yml
    secrets:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  # When Release Please creates a release, deploy the site from the release tag. This job
  # runs on main, which the github-pages environment allows, and checks out the tag.
  deploy-site:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-site.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  # When Release Please creates a release, promote the beta package version that the
  # Release workflow built, and add its install links to the release notes. The job reads
  # package-version.json from the tag. When the Release run chose to keep a beta, the job
  # does not promote it, and the notes offer only a sandbox. While sfdx-project.json names
  # no package, it only says so.
  promote-package:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Checkout the release tag"
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: "Set up Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: "Install npm dependencies"
        run: npm ci

      - name: "Check for a package"
        id: project
        run: echo "has-package=$(node scripts/package-version.mjs has-package)" >> "$GITHUB_OUTPUT"

      - name: "Install Salesforce CLI"
        if: ${{ steps.project.outputs.has-package == 'true' }}
        run: |
          npm install --global @salesforce/cli
          sf --version

      # The secret stays in an environment variable and reaches the CLI through
      # standard input, so it never appears in a script or a file.
      - name: "Authenticate Dev Hub"
        if: ${{ steps.project.outputs.has-package == 'true' }}
        env:
          SFDX_AUTH_URL: ${{ secrets.SALESFORCE_AUTH_URL }}
        run: |
          if [ -z "$SFDX_AUTH_URL" ]; then
            echo "The SALESFORCE_AUTH_URL secret is not set."
            exit 1
          fi
          echo "$SFDX_AUTH_URL" | sf org login sfdx-url --alias devhub --set-default-dev-hub --sfdx-url-stdin

      - name: "Promote the package version"
        if: ${{ steps.project.outputs.has-package == 'true' }}
        run: node scripts/package-version.mjs promote

      - name: "Add the install links to the release notes"
        if: ${{ steps.project.outputs.has-package == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          links=$(node scripts/package-version.mjs notes)
          if [ -z "$links" ]; then
            echo "The tag has no package version, so the release notes stay as they are."
            exit 0
          fi
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          printf '%s\n\n### Install\n\n%s\n' "$body" "$links" > release-notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
